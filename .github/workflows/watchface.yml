name: Build Pulse Ring watch face

on:
  push:
    paths:
      - "PulseRingWatchFace/**"
      - ".github/workflows/watchface.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PulseRingWatchFace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon :watchface:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PulseRing-apk
          path: PulseRingWatchFace/watchface/build/outputs/apk/debug/*.apk
